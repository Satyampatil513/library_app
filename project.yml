name: RoomCapture
options:
  bundleIdPrefix: com.satyam
  deploymentTarget:
    iOS: "17.0"
targets:
  RoomCapture:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RoomCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satyam.roomcapture
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        INFOPLIST_FILE: RoomCapture/Info.plist
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
