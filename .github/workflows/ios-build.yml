name: iOS Build Check

# Compiles the app on every push, unsigned, and packages an unsigned .ipa as a
# build artifact. That .ipa isn't installable as-is — a free Apple ID via
# AltStore/Sideloadly (or a paid-account TestFlight pipeline later) does the
# actual signing at install time, so no Apple Developer Program membership is
# needed for this path.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # needed to publish/update the "latest" release below

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project RoomCapture.xcodeproj \
            -scheme RoomCapture \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/RoomCapture.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r RoomCapture-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomCapture-unsigned-ipa
          path: RoomCapture-unsigned.ipa
          retention-days: 14

      # Overwrites a single rolling "latest" release on every push to master, so
      # there's always one stable link to the newest build instead of having to
      # dig through past Actions runs for the artifact.
      - name: Publish "latest" release with the IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build"
          body: |
            Automated unsigned build from commit ${{ github.sha }}.
            Sideload with Sideloadly or AltStore (free Apple ID) — see README.
          prerelease: true
          files: RoomCapture-unsigned.ipa
